<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Digital Crazy Hub</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/DCH.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

  <!-- Modular CSS -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/animations.css">

  <style>
    .notfound-wrapper {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    .notfound-card {
      max-width: 580px;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 50px 36px;
      box-shadow: var(--shadow-lg);
    }

    .notfound-code {
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      color: var(--blue);
      margin-bottom: 12px;
      font-family: var(--font-heading);
    }

    .notfound-title {
      font-size: 1.8rem;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .notfound-text {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .notfound-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 380px;
      margin: 0 auto;
    }
  </style>
</head>

<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-container" style="justify-content: center;">
      <a href="index.html">
        <img src="assets/images/DCH.png" alt="Digital Crazy Hub" class="site-logo">
      </a>
    </div>
  </header>

  <main class="notfound-wrapper">
    <div class="notfound-card">
      <div class="notfound-code">404</div>
      <h1 class="notfound-title">Page Not Found</h1>
      <p class="notfound-text">
        The link you clicked may be broken, or the page may have been moved. Return to the official workshop training
        portal to reserve your seat or access workshop resources.
      </p>

      <div class="notfound-actions">
        <a href="index.html" class="btn-primary">
          <i class="ph-bold ph-house"></i>
          <span>Return to Workshop Home</span>
        </a>
        <a href="https://wa.me/919047700201?text=Hi%20Digital%20Crazy%20Hub,%20I%20hit%20a%20404%20error"
          target="_blank" rel="noopener" class="btn-secondary">
          <i class="ph-fill ph-whatsapp-logo" style="color: #25d366;"></i>
          <span>Contact WhatsApp Support</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p style="font-size: 0.88rem; color: var(--muted);">© 2026 Digital Crazy Hub. All rights reserved.</p>
    </div>
  </footer>

</body>

</html>
